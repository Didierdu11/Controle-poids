// ---- Catalogue intégré v1 : [code, diamètre, nom, recettes...] = [nominal, mini, maxi, intervalle min]
const SEED=[["LCL080","80 mm","Tartelette Citron Meringuée",[45,43,47,30],[60,57,63,30],[25,23,27,30]],["LCF085","85 mm","Tartelette Fraise Pistache",[48,46,50,30],[65,62,68,30],[20,18,22,30]],["LCC080","80 mm","Tartelette Chocolat Caramel",[45,43,47,30],[70,67,73,30],[15,13.5,16.5,30]],["LCP090","90 mm","Tartelette Pomme Tatin",[55,52.5,57.5,30],[80,76,84,30],[18,16,20,30]],["LCB100","100 mm","Tartelette Framboise Vanille",[62,59,65,30],[85,81,89,30],[22,20,24,30]],["65000","100 mm","Tartelette citron cacahuète",[100,80,120,30],null,[12,8,14,30]]];

// ---- Import catalogue : lecteur .xlsx autonome (Excel, Google Sheets, LibreOffice). Colonnes par recette : « Nominal X », « Tolérance mini X », « Tolérance maxi X », « Temps X » (intervalle en minutes)
const nrm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s\u00A0]+/g,' ').trim().toLowerCase();
const ent=s=>s.replace(/&(#x?[0-9a-f]+|amp|lt|gt|quot|apos);/gi,(m,e)=>e[0]==='#'?String.fromCodePoint(e[1].toLowerCase()==='x'?parseInt(e.slice(2),16):parseInt(e.slice(1))):({amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"})[e.toLowerCase()]);
async function inflate(u8){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}

const colN=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
const parseSS=x=>[...x.replace(/<si\s*\/>/g,'<si></si>').matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)].map(m=>ent([...m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g,'').matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(y=>y[1]).join('')));
function sheetGrid(xml,ss){const g=[],rr=/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;let m,ri=0;
 while((m=rr.exec(xml))){const ra=m[0].match(/^<row\b[^>]*?\br="(\d+)"/),r=ra?+ra[1]-1:ri;ri=r+1;if(!m[1])continue;const row=[],cr=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;let c,ci=0;
  while((c=cr.exec(m[1]))){const at=c[1],ref=at.match(/\br="([A-Z]+)\d+"/),col=ref?colN(ref[1]):ci;ci=col+1;const t=(at.match(/\bt="(\w+)"/)||[])[1],b=c[2]||'';let v=null;
   if(t==='inlineStr')v=ent([...b.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(y=>y[1]).join(''));
   else{const vm=b.match(/<v>([\s\S]*?)<\/v>/);if(vm){const x=vm[1];v=t==='s'?ss[+x]:(t==='str'||t==='e')?ent(x):t==='b'?x==='1':parseFloat(x)}}
   if(v!==null&&v!==''&&!(typeof v==='number'&&isNaN(v)))row[col]=v}
  g[r]=row}

async function zipGrids(buf){const F=await unzip(buf);if(!F['xl/workbook.xml'])throw new Error('classeur Excel introuvable dans le fichier');

 [...rel.matchAll(/<Relationship\b[^>]*>/g)].forEach(m=>{const id=(m[0].match(/\bId="([^"]+)"/)||[])[1],t=(m[0].match(/\bTarget="([^"]+)"/)||[])[1];if(id&&t)tg[id]=t.replace(/^\/?(xl\/)?/,'xl/')});

async function gridsEx(buf){const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);return wb.worksheets.map(ws=>{const g=[];ws.eachRow({includeEmpty:false},(row,r)=>{const a=[];row.eachCell({includeEmpty:false},(c,i)=>{let v=c.value;if(v&&typeof v==='object')v=v.result??v.text??(v.richText?v.richText.map(x=>x.text).join(''):null);if(v!=null&&v!=='')a[i-1]=v});g[r-1]=a});return{name:ws.name,g}})}
const HT=/^(?:poids\s+)?(nominale?|tol(?:erance)?\.?\s*min(?:i|imum)?|tol(?:erance)?\.?\s*max(?:i|imum)?|temps|intervalle)\s+(.+?)\s*(\(.*\))?$/;
function parseGrid(grids){let sel=null;
 for(const sh of grids){for(let r=0;r<Math.min(sh.g.length,25);r++){const hs=(sh.g[r]||[]).map(nrm);if(hs.some(h=>h.startsWith('code'))&&hs.some(h=>HT.test(h))){sel={g:sh.g,r,name:sh.name};break}}if(sel)break}
 if(!sel){const first=((grids[0]&&grids[0].g.find(r=>r&&r.length))||[]).filter(x=>x!=null).map(String).slice(0,8).join(' | ');throw new Error('en-têtes introuvables : il faut une colonne « Code produit » et des colonnes « Nominal … ». En-têtes lus : '+(first||'aucun'))}

  ord.forEach(k=>{const c=cols[k],v=g(c.v);if(v==null){warns.push(`${code} : recette « ${c.name} » ignorée (pas de nominal)`);return}

   if((mi!=null&&mi>v)||(ma!=null&&ma<v)||(mi!=null&&ma!=null&&mi>ma))warns.push(`${code} : « ${c.name} » tolérances incohérentes avec le nominal`);
   st.push({n:c.name,v,mi,ma,dt:dt>0?dt:30})});
  if(!st.length){warns.push(`${code} : aucune recette, produit ignoré`);continue}
  const it={code,diam:ci.d!=null&&row[ci.d]!=null?String(row[ci.d]).trim():'',nom:ci.n!=null&&row[ci.n]!=null?String(row[ci.n]).trim():code,st};
  if(seen[code]!=null){warns.push(`Code ${code} en double : la dernière ligne est conservée`);items[seen[code]]=it}else{seen[code]=items.length;items.push(it)}}

// IMPORT-END
// EQUIP-BEGIN
// ---- Équipements par recette (fichier Excel : 1 colonne par recette, séries séparées par une ligne vide, code entre parenthèses obligatoire, « + » devant les équipements d’une série = 1 ou 2 possibles)
const recKey=n=>{const k=nrm(String(n).replace(/\s*[:：]\s*$/,''));return k==='garniture'?'garniture 1':k};
const colL=i=>{let s='';i++;while(i){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s};
const TC={tarto:['#FFF3B0','#7a6400'],fillpack:['#FBD9E8','#8a2a5a'],pompe:['#FFE3C7','#8a4a10'],nappeuse:['#D6EEFB','#0e5a7a'],cuve:['#EADFCB','#5a4020']},tcs=l=>{const t=TC[nrm(l)]||['#E4E7EB','#444'];return `background:${t[0]};color:${t[1]};border-color:${t[1]}66`};
const EQ=()=>S.eqs.find(e=>e.v===S.eact),saveE=()=>put('eqs',{list:S.eqs,act:S.eact});
function parseEq(grids,cat){const sh=grids.find(s=>s.g.some(r=>r&&r.some(x=>x!=null)));if(!sh)throw new Error('fichier vide');
 const g=sh.g,hr=g.findIndex(r=>r&&r.some(x=>x!=null)),data={},warns=[],errs=[],names={};
 g[hr].forEach((raw,ci)=>{if(raw==null||String(raw).trim()==='')return;const name=String(raw).replace(/\s*[:：]\s*$/,'').trim(),key=recKey(name),series=[];let cur=null;
  for(let r=hr+1;r<g.length;r++){const cell=g[r]&&g[r][ci];if(cell==null||String(cell).trim()===''){cur=null;continue}
   let t=String(cell).trim(),plus=false;if(t[0]==='+'){plus=true;t=t.slice(1).trim()}
   const m=t.match(/^(.*?)\s*\(([^()]+)\)\s*$/);if(!m||!m[1].trim()){errs.push(`${colL(ci)}${r+1} : « ${t} » n’a pas de code entre parenthèses`);continue}
   if(!cur){cur={label:m[1].trim().split(/\s+/)[0],multi:false,items:[],plus:0};series.push(cur)}
   const code=m[2].trim(),nm=m[1].trim();if(plus){cur.multi=true;cur.plus++}
   if(cur.items.some(i=>i.code===code)){warns.push(`${colL(ci)}${r+1} : code ${code} en double dans la série`);continue}
   if(names[code]&&names[code]!==nm)warns.push(`${colL(ci)}${r+1} : le code ${code} désigne « ${nm} » ici et « ${names[code]} » ailleurs`);names[code]=nm;cur.items.push({code,name:nm})}
  series.forEach(s=>{if(s.plus&&s.plus<s.items.length)warns.push(`${name} : série ${s.label} avec « + » sur une partie seulement (traitée comme 1 ou 2)`);delete s.plus});
  if(series.length){if(data[key])warns.push(`Recette « ${name} » en double : la dernière colonne est conservée`);data[key]={name,series}}});

async function impE(file){if(!file)return;try{const buf=await file.arrayBuffer();let gr;try{gr=await zipGrids(buf)}catch(e1){if(!window.ExcelJS)throw e1;try{gr=await gridsEx(buf)}catch(e2){throw e1}}

async function saveEq(){const p=S.pendE,v=(S.eqs.length?Math.max(...S.eqs.map(e=>e.v)):0)+1;S.eqs.push({v,name:p.name,d:Date.now(),data:p.data,note:p.note});S.eact=v;S.pendE=null;await saveE();render()}

async function okEq(){const k=$('#et').value,n=$('#en2').value.trim(),m=$('#em').value.trim();if(!n||!m)return alert('Numéro et motif obligatoires.');const l=L();l.eq.push({t:Date.now(),k,old:l[k],new:n,m,op:l.op.n+' '+l.op.p});l[k]=n;S.dlg=null;await saveL();render()}

let strm;DG.cam=()=>sheet(`<h2 style="margin-top:0">Photo</h2><video id="cv" autoplay playsinline muted style="width:100%;border-radius:10px;background:#000"></video><div class="row" style="margin-top:10px"><button class="sec" onclick="stopCam();closeDlg()">Annuler</button><button onclick="snap()">📷 Capturer</button></div><label>Ou utiliser l’appareil photo du système / un fichier</label><input type="file" accept="image/*" capture="environment" onchange="fromFile(this.files[0])">`);
async function startCam(){try{strm=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#cv').srcObject=strm}catch(e){}}
const stopCam=()=>{strm?.getTracks().forEach(t=>t.stop());strm=null};
const shrink=(src,w,h,m=800)=>{const k=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');c.width=w*k;c.height=h*k;c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)};
function snap(){const v=$('#cv');if(!v.videoWidth)return;S.vis.photo=shrink(v,v.videoWidth,v.videoHeight);S.vis.thumb=shrink(v,v.videoWidth,v.videoHeight,160);stopCam();S.dlg=null;render()}
async function fromFile(fl){if(!fl)return;const b=await createImageBitmap(fl);S.vis.photo=shrink(b,b.width,b.height);S.vis.thumb=shrink(b,b.width,b.height,160);stopCam();S.dlg=null;render()}
// ---- Statistiques, tendance, écart-type cumulé
function stats(s){const a=s.d.map(r=>r.v),n=a.length;if(!n||isV(s))return null;const m=a.reduce((x,y)=>x+y,0)/n,sd=n>1?Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(n-1)):null,o=a.slice().sort((x,y)=>x-y),ht=a.filter(v=>out(s,v)).length;
 let cp=null,cpk=null;if(sd>0){if(s.mi!=null&&s.ma!=null)cp=(s.ma-s.mi)/(6*sd);const u=[];if(s.ma!=null)u.push((s.ma-m)/(3*sd));if(s.mi!=null)u.push((m-s.mi)/(3*sd));if(u.length)cpk=Math.min(...u)}
 return{n,m,sd,mn:o[0],mx:o[n-1],med:n%2?o[(n-1)/2]:(o[n/2-1]+o[n/2])/2,ht,pct:ht/n*100,cp,cpk}}
function trend(s){const n=s.d.length;if(n<2)return null;const X=s.d.map(r=>r.t),Y=s.d.map(r=>r.v),mx=X.reduce((a,b)=>a+b)/n,my=Y.reduce((a,b)=>a+b)/n,sx=X.reduce((a,x)=>a+(x-mx)**2,0);if(!sx)return null;const b=X.reduce((a,x,k)=>a+(x-mx)*(Y[k]-my),0)/sx,a=my-b*mx,t0=Math.min(...X),t1=Math.max(...X);return{pts:[{t:t0,v:a+b*t0},{t:t1,v:a+b*t1}],h:b*36e5}}
function svg(se,o={}){const W=360,H=220,pl=42,pr=10,pt=20,pb=26,tx=o.tx||'var(--muted)',gr=o.gr||'var(--line)',px=o.px?`width="${o.px[0]}" height="${o.px[1]}"`:'width="100%"';
 const T=se.flatMap(s=>s.pts.map(p=>p.t)),V=se.flatMap(s=>s.pts.map(p=>p.v).concat([s.mi,s.ma].filter(x=>x!=null),o.stat&&s.tr?s.tr.map(p=>p.v):[]));if(!T.length)return '<div class="muted">Aucune valeur</div>';
 let t0=Math.min(...T),t1=Math.max(...T);if(t1==t0)t1=t0+18e5;let lo=Math.min(...V),hi=Math.max(...V);const pd=(hi-lo||1)*.1;lo-=pd;hi+=pd;
 const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),Y=v=>H-pb-(v-lo)/(hi-lo)*(H-pt-pb),ln=(v,c,d,w=1)=>v==null?'':`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="${d}" stroke-width="${w}"/>`;let g='';
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${gr}"/><text x="${pl-4}" y="${Y(v)+4}" text-anchor="end" fill="${tx}" font-size="10">${f(v)}</text>`}
 for(let k=0;k<=3;k++){const t=t0+(t1-t0)*k/3;g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${H-pb}" stroke="${gr}"/><text x="${X(t)}" y="${H-9}" text-anchor="middle" fill="${tx}" font-size="10">${hh(t)}</text>`}
 se.forEach((s,k)=>{g+=`<text x="${pl+k*95}" y="12" fill="${s.c}" font-size="11" font-weight="bold">● ${esc(s.name)}</text>`+ln(s.mi,s.c,'4 3')+ln(s.ma,s.c,'4 3');
  if(o.stat&&s.m!=null){g+=ln(s.m,s.c,'0',1.5)+(s.sd?ln(s.m+s.sd,s.c,'1 3')+ln(s.m-s.sd,s.c,'1 3'):'')}
  if(o.stat&&s.tr)g+=`<line x1="${X(s.tr[0].t)}" y1="${Y(s.tr[0].v)}" x2="${X(s.tr[1].t)}" y2="${Y(s.tr[1].v)}" stroke="#333" stroke-width="2" stroke-dasharray="10 3 2 3"/>`;
  g+=`<polyline points="${s.pts.map(p=>X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2"/>`+s.pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="${out(s,p.v)?'#c0392b':s.c}"/>`).join('')});
 return `<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" viewBox="0 0 ${W} ${H}" ${px}>${g}</svg>`}
const ser=(s,i)=>{const k=stats(s)||{},t=trend(s);return{c:P[i%P.length],name:s.n,u:s.u,raw:s.d,pts:s.d.map(r=>({t:r.t,v:r.v})),mi:s.mi,ma:s.ma,m:k.m,sd:k.sd,tr:t&&t.pts}};
const erf=x=>{const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y},cdf=(x,m,sd)=>.5*(1+erf((x-m)/(sd*Math.SQRT2)));
const gOut=(s,k)=>k&&k.sd>0?((s.mi!=null?cdf(s.mi,k.m,k.sd):0)+(s.ma!=null?1-cdf(s.ma,k.m,k.sd):0))*100:null;
function gauss(s,i,o={}){const k=stats(s);if(!k||!(k.sd>0))return '<div class="muted">Il faut au moins 2 valeurs différentes.</div>';
 const W=360,H=220,pl=42,pr=10,pt=20,pb=28,tx=o.tx||'var(--muted)',gr=o.gr||'var(--line)',c=P[i%P.length],px=o.px?`width="${o.px[0]}" height="${o.px[1]}"`:'width="100%"';
 let lo=k.m-4*k.sd,hi=k.m+4*k.sd;[s.mi,s.ma].forEach(v=>{if(v!=null){lo=Math.min(lo,v-k.sd);hi=Math.max(hi,v+k.sd)}});
 const pdf=x=>Math.exp(-((x-k.m)**2)/(2*k.sd**2))/(k.sd*Math.sqrt(2*Math.PI)),mx=pdf(k.m)*1.1,X=x=>pl+(x-lo)/(hi-lo)*(W-pl-pr),Y=y=>H-pb-y/mx*(H-pt-pb);
 const area=(a,b,col,op)=>{if(b<=a)return '';const p=[];for(let j=0;j<=30;j++){const x=a+(b-a)*j/30;p.push(X(x)+','+Y(pdf(x)))}return `<polygon points="${X(a)},${Y(0)} ${p.join(' ')} ${X(b)},${Y(0)}" fill="${col}" opacity="${op}"/>`};
 const vl=(x,col,d,w=1.5)=>`<line x1="${X(x)}" x2="${X(x)}" y1="${pt}" y2="${H-pb}" stroke="${col}" stroke-width="${w}" stroke-dasharray="${d}"/>`;let g='';
 for(let j=0;j<=4;j++){const x=lo+(hi-lo)*j/4;g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${pt}" y2="${H-pb}" stroke="${gr}"/><text x="${X(x)}" y="${H-12}" text-anchor="middle" fill="${tx}" font-size="10">${f(x)}</text>`}
 for(let j=0;j<=3;j++){const y=mx*j/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="${gr}"/><text x="${pl-4}" y="${Y(y)+4}" text-anchor="end" fill="${tx}" font-size="10">${f(y,2)}</text>`}
 g+=`<text x="${W-pr}" y="${H-1}" text-anchor="end" fill="${tx}" font-size="10">${s.u}</text><text x="${pl}" y="12" fill="${c}" font-size="11" font-weight="bold">● μ=${f(k.m,2)} · σ=${f(k.sd,2)}</text>`;
 const N=80,pts=Array.from({length:N+1},(_,j)=>{const x=lo+(hi-lo)*j/N;return X(x)+','+Y(pdf(x))}).join(' ');
 g+=area(lo,hi,c,.15);if(s.mi!=null)g+=area(lo,s.mi,'#c0392b',.45);if(s.ma!=null)g+=area(s.ma,hi,'#c0392b',.45);
 g+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2"/>`+(s.mi!=null?vl(s.mi,'#c0392b','5 3'):'')+(s.ma!=null?vl(s.ma,'#c0392b','5 3'):'')+(s.v!=null?vl(s.v,'#2e7d4f','2 3'):'')+vl(k.m,c,'0',1.5);
 g+=s.d.map(r=>`<circle cx="${X(r.v)}" cy="${Y(0)-4}" r="3" fill="${out(s,r.v)?'#c0392b':c}" opacity=".8"/>`).join('');
 return `<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" viewBox="0 0 ${W} ${H}" ${px}>${g}</svg>`}
const gv=(key,s,i)=>{const k=stats(s),go=gOut(s,k);return tog(key)+(S.vm[key]?`<table>${k&&k.sd>0?[['Moyenne μ',f(k.m,2)+' '+s.u],['Écart-type σ',f(k.sd,2)+' '+s.u],['μ − 3σ',f(k.m-3*k.sd,2)+' '+s.u],['μ + 3σ',f(k.m+3*k.sd,2)+' '+s.u],['Hors tolérance estimé',f(go,2)+' %']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join(''):'<tr><td>Il faut au moins 2 valeurs différentes.</td></tr>'}</table>`:gauss(s,i))};
const tog=k=>`<div class="row" style="margin-bottom:6px"><button class="sec sm ${S.vm[k]?'':'on'}" onclick="S.vm['${k}']=0;render()">Graphique</button><button class="sec sm ${S.vm[k]?'on':''}" onclick="S.vm['${k}']=1;render()">Valeurs</button></div>`;
const vw=(k,se,o)=>tog(k)+(S.vm[k]?`<div style="overflow-x:auto"><table>${se.map(s=>`<tr><th colspan="3" style="color:${s.c}">${esc(s.name)}</th></tr>`+s.raw.map(r=>`<tr><td>${hh(r.t)}</td><td>${f(r.v,2)} ${s.u}</td><td>${esc(r.op)}${r.c?' · corrigé':''}</td></tr>`).join('')).join('')}</table></div>`:svg(se,o));

const NOT=[['Démarrer un lot','Sur l’accueil : n° de lot (proposé : dernier chiffre de l’année + n° du jour + R, modifiable), produit, n° de balance, n° de thermomètre (facultatif), nom et prénom. Un seul lot peut être ouvert à la fois : il faut le clôturer avant d’en démarrer un autre. Si les équipements sont obligatoires, choisissez-les avant de démarrer.'],['Saisir une recette','Chaque recette (pâte, garniture, meringue…) a sa couleur et son rythme. Elle démarre à sa première saisie, qui comprend 3 valeurs obligatoires. Ensuite chaque relevé comporte 4 champs dont 2 au moins sont à renseigner. Touchez un champ : un pavé numérique s’ouvre pour saisir les valeurs d’affilée (Suivant, Valider) ; les dernières saisies s’affichent sur une ligne sous les champs. Ensuite une saisie est attendue à chaque intervalle du catalogue (30 min par défaut). <b>Le compteur repart à zéro à chaque validation d’un relevé</b> et affiche « Dans X min » ou « Retard X min », mis à jour chaque minute. Le poids nominal est affiché en grand ; la zone de saisie est encadrée par le min et le max.'],['Hors tolérance','Une valeur hors min/max ouvre un cadre rouge ⚠️ bloquant : indiquez les actions menées (liste ou texte libre). La carte reste en rouge jusqu’au prochain relevé conforme.'],['Visuel','Recette ajoutée automatiquement à chaque lot, toutes les 30 min : choisir Conforme ou Non conforme et prendre une photo (caméra de la tablette). Si la photo n’est pas obligatoire pour ce lot, elle est facultative. Non conforme déclenche une correction. Le compteur repart à zéro à chaque enregistrement.'],['Enregistrement','Bouton « Ajouter un enregistrement » : saisie exceptionnelle (température, poids…) sans nominal ni tolérance, avec son propre graphique. Non repris dans le catalogue Excel.'],['Changer d’opérateur','Bouton « Changer d’opérateur » : le nouvel opérateur retrouve les saisies précédentes du lot. Chaque valeur garde le nom de celui qui l’a saisie. À 5 h, 13 h et 21 h, le bouton clignote avec un bandeau « Relève » tant que l’opérateur n’a pas été changé (si le lot a démarré avant l’heure de relève) ; si le même opérateur continue, il valide quand même « Changer d’opérateur » avec son nom.'],['Balance et thermomètre','Le n° de balance est obligatoire au démarrage, le n° de thermomètre est facultatif. Bouton « Remplacer balance / thermo » : saisir le nouveau numéro et le motif (obligatoire) ; il permet aussi d’ajouter un thermomètre en cours de lot. Chaque relevé garde le numéro utilisé ; l’historique figure dans l’onglet Lot de l’export.'],['Équipements','Importer le fichier sur l’accueil (carte « Équipements ») : il est mémorisé par version, comme le catalogue. Format : une colonne par recette (nom en 1re ligne, mêmes noms que le catalogue : Pâte, Garniture 1, Garniture 2, Nappage, Micro doseuse, Meringue), puis les équipements ; une ligne vide sépare les séries. Chaque équipement doit avoir un code entre parenthèses, par exemple Pompe 1 (P1), sinon l’import est refusé. Un signe + devant les équipements d’une série autorise d’en choisir 1 ou 2 (Tarto) ; sinon un seul est obligatoire par série. Avant le lot, rien n’est présélectionné : choisissez un équipement par série ; un équipement pris par une recette est grisé pour les autres. Les codes s’affichent en badges ronds sous le nom de la recette (une couleur par type d’équipement).'],['Équipements : option, activation, remplacement','La case « Équipements obligatoires » (cochée par défaut) peut être décochée à l’accueil : dans le lot, le bouton devient « Activer les équipements » ; l’activation est définitive et les relevés déjà saisis restent sans équipement. Bouton « Remplacer un équipement » : une page présente toutes les recettes du lot avec des boutons à toucher ; seuls les équipements libres sont proposés ; un seul motif obligatoire pour la validation ; l’ancien redevient disponible ; pour Tarto on peut ajouter ou retirer un Tarto (1 minimum). Chaque relevé garde les équipements en cours ; chaque changement est daté dans la page Relevés et dans l’onglet Équipements de l’export.'],['Remarques','Bouton « 📝 Remarque » dans le cadre du lot : une page permet d’ajouter une remarque libre, horodatée avec l’opérateur ; elle n’est pas rattachée à une recette et n’est ni modifiable ni supprimable. Les remarques apparaissent dans la page Relevés (ligne 📝) et dans l’export (onglet Remarques et lignes « Remarque » de l’onglet Relevés). Consultables sur un lot clôturé.'],['Annuler un relevé','Page Relevés : bouton « Annuler » à côté d’une valeur, avec motif obligatoire. La ligne reste visible, barrée et marquée « Annulé » (avec l’heure, l’opérateur et le motif) ; elle n’est plus comptée dans les statistiques, les courbes ni le compteur, qui revient à la dernière valeur valide. Elle figure dans l’export. Impossible sur un lot clôturé.'],['Graphiques','Boutons « Graphique / Valeurs » pour basculer entre la courbe et le tableau. Le graphique commun est en bas de la page Saisie. La page Statistiques ajoute la tendance et la courbe de Gauss.'],['Écart-type (σ)','Mesure la dispersion des poids autour de la moyenne : plus σ est petit, plus les poids sont réguliers. Calcul : σ = racine de [somme des (valeur − moyenne)² ÷ (n − 1)]. Si les poids suivent une loi normale, environ 68 % des valeurs sont à moins de 1σ de la moyenne, 95 % à moins de 2σ et 99,7 % à moins de 3σ.'],['Cp (capabilité potentielle)','Cp = (tolérance maxi − tolérance mini) ÷ 6σ. Compare la largeur de la tolérance à la dispersion réelle, sans tenir compte du centrage. Cp ≥ 1,33 : procédé capable ; entre 1 et 1,33 : limite ; inférieur à 1 : dispersion trop grande pour la tolérance.'],['Cpk (capabilité réelle)','Cpk = plus petite valeur entre (maxi − moyenne) ÷ 3σ et (moyenne − mini) ÷ 3σ. Tient compte du centrage de la moyenne dans la tolérance. Le Cpk est toujours inférieur ou égal au Cp : un Cp élevé avec un Cpk bas signale un procédé régulier mais décentré (poids trop proches d’une limite). Seuil usuel : 1,33. Avec peu de relevés, ces valeurs sont indicatives.'],['Courbe de Gauss','Courbe en cloche (loi normale) construite avec la moyenne et l’écart-type de vos relevés. Le sommet correspond à la moyenne ; plus la cloche est étroite, plus la production est régulière. Les traits rouges sont le min et le max, le trait vert est le nominal, les points sont les relevés. Les zones rouges sous la courbe estiment la part de produits hors tolérance (« HT estimé »). Cette estimation suppose une distribution normale.'],['Tendance','Droite qui résume l’évolution des poids dans le temps, en unité par heure. Positive : le poids augmente ; négative : il diminue ; proche de zéro : stable.'],['Clôture et export','Page Clôture : les relevés manquants sont signalés sans bloquer. « Clôturer et exporter » génère le fichier Excel lot_produit_aammjj, le relit pour le contrôler (onglets, nombre de lignes, valeurs invalides, images), puis seulement ensuite le télécharge, verrouille le lot en lecture seule et télécharge une sauvegarde JSON. Si le contrôle échoue, le lot reste ouvert. Onglets : Lot (recettes, contrôles, empreinte), Relevés (liste chronologique complète avec écart de temps et motifs), Corrections et Statistiques (recettes en colonnes), Graphique, Enregistrement, Équipements (noms), Remarques, Visuel. Ré-export possible.'],['Catalogue et versions','Accueil > Catalogue : importer un fichier Excel crée une nouvelle version avec le résumé des changements. Colonnes par recette : Nominal X, Tolérance mini X, Tolérance maxi X, Temps X (intervalle en minutes). Une recette sans nominal est ignorée ; sans tolérance, elle n’est pas contrôlée. Le fichier peut être modifié avec Excel, Google Sheets ou LibreOffice puis enregistré en .xlsx : l’application cherche elle-même la feuille et la ligne d’en-têtes (accents et majuscules sans importance) et signale les anomalies avant l’enregistrement. « Garniture » sans numéro est lue comme Garniture 1. Chaque lot garde sa version.'],['Données et sauvegarde','Tout est enregistré sur l’appareil à chaque saisie, même sans réseau. Les données restent propres à chaque poste. Utilisez « Sauvegarde JSON » en cas de changement d’appareil.'],['Installation et mises à jour','Première ouverture avec Internet, puis « Installer » depuis le navigateur (Edge ou Chrome). Quand une nouvelle version est disponible, un bandeau propose la mise à jour.']];
