async function parseX(buf){const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);const ws=wb.worksheets[0],H=[],cols={},ord=[],ci={},warns=[],items=[];
 const val=c=>{let v=c.value;if(v&&typeof v==='object')v=v.result??v.text??(v.richText?v.richText.map(x=>x.text).join(''):null);return v};
 ws.getRow(1).eachCell((c,i)=>{H[i]=String(val(c)).trim()});
 H.forEach((h,i)=>{const m=h.match(/^(?:poids\s+)?(nominale?|tol[ée]rance mini|tol[ée]rance maxi|temps)\s+(.+?)\s*(\(.*\))?$/i);
  if(m){const t=m[1].toLowerCase(),k=m[2].trim().toLowerCase(),key=t.startsWith('nom')?'v':t.endsWith('mini')?'mi':t.endsWith('maxi')?'ma':'dt';if(!cols[k]){cols[k]={};ord.push(k)}cols[k][key]=i}
  else{const l=h.toLowerCase();if(l.startsWith('code'))ci.c=i;else if(l.startsWith('diam'))ci.d=i;else if(l==='nom')ci.n=i}});
 if(!ci.c||!ord.length)throw new Error('Colonnes « Code produit » et « Nominal … » introuvables');
 ws.eachRow((row,r)=>{if(r<2)return;const cc=row.getCell(ci.c),code=String(val(cc)??'').trim();if(!code)return;
  if(typeof val(cc)==='number')warns.push(`Code ${code} : numérique converti en texte`);
  const st=[];ord.forEach(k=>{const g=a=>a==null?null:num(val(row.getCell(a)));const v=g(cols[k].v);
   if(v==null){warns.push(`${code} : recette « ${cap(k)} » ignorée (pas de nominal)`);return}
   const mi=g(cols[k].mi),ma=g(cols[k].ma);let dt=g(cols[k].dt);if(mi==null&&ma==null)warns.push(`${code} : « ${cap(k)} » sans tolérance (pas de contrôle)`);

 return `${K(B).filter(k=>!A[k]).length} ajouté(s), ${K(B).filter(k=>A[k]&&A[k]!==B[k]).length} modifié(s), ${K(A).filter(k=>!B[k]).length} retiré(s)`}

function okHt(){const d=S.dlg,x=$('#cx').value.trim();if(!d.a.length&&!x)return $('#er').hidden=false;const c={r:d.r,a:d.a,x};closeDlg();d.vis?addV(c):add(d.i,d.vs,c)}
DG.op=()=>sheet(`<h2 style="margin-top:0">Nouvel opérateur</h2><div class="row"><input id="on" placeholder="Nom"><input id="op" placeholder="Prénom"></div><p class="muted">Il retrouve toutes les saisies précédentes du lot.</p><div class="row"><button class="sec" onclick="closeDlg()">Annuler</button><button onclick="okOp()">Valider</button></div>`);

// ---- Statistiques, tendance, écart-type cumulé
function stats(s){const a=s.d.map(r=>r.v),n=a.length;if(!n||isV(s))return null;const m=a.reduce((x,y)=>x+y,0)/n,sd=n>1?Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(n-1)):null,o=a.slice().sort((x,y)=>x-y),ht=a.filter(v=>out(s,v)).length;
 let cp=null,cpk=null;if(sd>0){if(s.mi!=null&&s.ma!=null)cp=(s.ma-s.mi)/(6*sd);const u=[];if(s.ma!=null)u.push((s.ma-m)/(3*sd));if(s.mi!=null)u.push((m-s.mi)/(3*sd));if(u.length)cpk=Math.min(...u)}
 return{n,m,sd,mn:o[0],mx:o[n-1],med:n%2?o[(n-1)/2]:(o[n/2-1]+o[n/2])/2,ht,pct:ht/n*100,cp,cpk}}
function trend(s){const n=s.d.length;if(n<2)return null;const X=s.d.map(r=>r.t),Y=s.d.map(r=>r.v),mx=X.reduce((a,b)=>a+b)/n,my=Y.reduce((a,b)=>a+b)/n,sx=X.reduce((a,x)=>a+(x-mx)**2,0);if(!sx)return null;const b=X.reduce((a,x,k)=>a+(x-mx)*(Y[k]-my),0)/sx,a=my-b*mx,t0=Math.min(...X),t1=Math.max(...X);return{pts:[{t:t0,v:a+b*t0},{t:t1,v:a+b*t1}],h:b*36e5}}
function svg(se,o={}){const W=360,H=220,pl=42,pr=10,pt=20,pb=26,tx=o.tx||'var(--muted)',gr=o.gr||'var(--line)',px=o.px?`width="${o.px[0]}" height="${o.px[1]}"`:'width="100%"';
 const T=se.flatMap(s=>s.pts.map(p=>p.t)),V=se.flatMap(s=>s.pts.map(p=>p.v).concat([s.mi,s.ma].filter(x=>x!=null),o.stat&&s.tr?s.tr.map(p=>p.v):[]));if(!T.length)return '<div class="muted">Aucune valeur</div>';

const NOT=[['Démarrer un lot','Sur l’accueil : n° de lot (proposé : dernier chiffre de l’année + n° du jour + R, modifiable), produit, n° de balance, n° de thermomètre (facultatif), nom et prénom. Un seul lot peut être ouvert à la fois : il faut le clôturer avant d’en démarrer un autre.'],['Saisir une recette','Chaque recette (pâte, garniture, meringue…) a sa couleur et son rythme. Elle démarre à sa première saisie, qui comprend 3 valeurs simultanées. Ensuite une saisie est attendue à chaque intervalle du catalogue (30 min par défaut). <b>Le compteur repart à zéro à chaque validation d’un relevé</b> et affiche « Dans X min » ou « Retard X min », mis à jour chaque minute. Le poids nominal est affiché en grand ; la zone de saisie est encadrée par le min et le max.'],['Hors tolérance','Une valeur hors min/max ouvre un cadre rouge ⚠️ bloquant : indiquez les actions menées (liste ou texte libre). La carte reste en rouge jusqu’au prochain relevé conforme.'],['Visuel','Recette ajoutée automatiquement à chaque lot, toutes les 30 min : choisir OK ou Non conforme et prendre une photo (caméra de la tablette). Si la photo n’est pas obligatoire pour ce lot, elle est facultative. Non conforme déclenche une correction. Le compteur repart à zéro à chaque enregistrement.'],['Enregistrement','Bouton « Ajouter un enregistrement » : saisie exceptionnelle (température, poids…) sans nominal ni tolérance, avec son propre graphique. Non repris dans le catalogue Excel.'],['Changer d’opérateur','Bouton « Changer d’opérateur » : le nouvel opérateur retrouve les saisies précédentes du lot. Chaque valeur garde le nom de celui qui l’a saisie.'],['Balance et thermomètre','Le n° de balance est obligatoire au démarrage, le n° de thermomètre est facultatif. Bouton « Remplacer balance / thermo » : saisir le nouveau numéro et le motif (obligatoire) ; il permet aussi d’ajouter un thermomètre en cours de lot. Chaque relevé garde le numéro utilisé ; l’historique figure dans l’onglet Lot de l’export.'],['Graphiques','Boutons « Graphique / Valeurs » pour basculer entre la courbe et le tableau. Le graphique commun est en bas de la page Saisie. La page Statistiques ajoute la tendance et la courbe de Gauss.'],['Écart-type (σ)','Mesure la dispersion des poids autour de la moyenne : plus σ est petit, plus les poids sont réguliers. Calcul : σ = racine de [somme des (valeur − moyenne)² ÷ (n − 1)]. Si les poids suivent une loi normale, environ 68 % des valeurs sont à moins de 1σ de la moyenne, 95 % à moins de 2σ et 99,7 % à moins de 3σ.'],['Cp (capabilité potentielle)','Cp = (tolérance maxi − tolérance mini) ÷ 6σ. Compare la largeur de la tolérance à la dispersion réelle, sans tenir compte du centrage. Cp ≥ 1,33 : procédé capable ; entre 1 et 1,33 : limite ; inférieur à 1 : dispersion trop grande pour la tolérance.'],['Cpk (capabilité réelle)','Cpk = plus petite valeur entre (maxi − moyenne) ÷ 3σ et (moyenne − mini) ÷ 3σ. Tient compte du centrage de la moyenne dans la tolérance. Le Cpk est toujours inférieur ou égal au Cp : un Cp élevé avec un Cpk bas signale un procédé régulier mais décentré (poids trop proches d’une limite). Seuil usuel : 1,33. Avec peu de relevés, ces valeurs sont indicatives.'],['Courbe de Gauss','Courbe en cloche (loi normale) construite avec la moyenne et l’écart-type de vos relevés. Le sommet correspond à la moyenne ; plus la cloche est étroite, plus la production est régulière. Les traits rouges sont le min et le max, le trait vert est le nominal, les points sont les relevés. Les zones rouges sous la courbe estiment la part de produits hors tolérance (« HT estimé »). Cette estimation suppose une distribution normale.'],['Tendance','Droite qui résume l’évolution des poids dans le temps, en unité par heure. Positive : le poids augmente ; négative : il diminue ; proche de zéro : stable.'],['Clôture et export','Page Clôture : les relevés manquants sont signalés sans bloquer. « Clôturer et exporter » crée le fichier Excel lot_produit_aammjj et verrouille le lot en lecture seule (ré-export possible).'],['Catalogue et versions','Accueil > Catalogue : importer un fichier Excel crée une nouvelle version avec le résumé des changements. Colonnes par recette : Nominal X, Tolérance mini X, Tolérance maxi X, Temps X (intervalle en minutes). Une recette sans nominal est ignorée ; sans tolérance, elle n’est pas contrôlée. Chaque lot garde sa version.'],['Données et sauvegarde','Tout est enregistré sur l’appareil à chaque saisie, même sans réseau. Les données restent propres à chaque poste. Utilisez « Sauvegarde JSON » en cas de changement d’appareil.'],['Installation et mises à jour','Première ouverture avec Internet, puis « Installer » depuis le navigateur (Edge ou Chrome). Quand une nouvelle version est disponible, un bandeau propose la mise à jour.']];

const png=s=>new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=720;c.height=440;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,720,440);x.drawImage(im,0,0,720,440);ok(c.toDataURL('image/png').split(',')[1])};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)});

async function exportX(close){if(!window.ExcelJS)return alert('Bibliothèque Excel non chargée : connectez-vous une fois à Internet.');
 const l=L();if(close&&!l.closed){l.closed=true;l.t1=Date.now();await saveL()}const end=l.t1||Date.now(),ns=l.steps.length,wb=new ExcelJS.Workbook();
 const sh=(n,h,rows)=>{const w=wb.addWorksheet(n);if(h)hdr(w.addRow(h));rows.forEach(r=>w.addRow(r));w.columns.forEach(c=>c.width=18);return w};

 lot.addRow([]);hdr(lot.addRow(['Remplacements','Équipement','Ancien n°','Nouveau n°','Motif','Opérateur']));l.eq.forEach(e=>lot.addRow([dtf(e.t),e.k==='bal'?'Balance':'Thermomètre',e.old,e.new,e.m,e.op]));
 const R=[],C=[],ST=[];
 l.steps.forEach((s,i)=>{const mn=missN(s,end),G=grp(s),k=stats(s)||{},t=trend(s);let prev=null;
  for(let g=0;g<G;g++){const es=s.d.filter(r=>r.g===g);es.forEach(r=>R.push([l.code,l.pc,s.n,g+1,prev==null?'':dtf(prev+iv(s)),dtf(r.t),r.v,s.u,s.v,s.mi,s.ma,out(s,r.v)?'Hors tolérance (corrigé)':'Conforme',r.op,r.bal,r.th]));if(es[0])prev=es[0].t}
  for(let m=1;m<=mn;m++)R.push([l.code,l.pc,s.n,G+m,dtf(prev+iv(s)*m),'',null,s.u,s.v,s.mi,s.ma,'Non réalisé','','','']);
  ST.push([s.n,s.u,s.v,s.mi,s.ma,G+mn,G,mn,k.m,k.sd,k.med,k.mn,k.mx,k.mx==null?null:k.mx-k.mn,k.pct,k.cp,k.cpk,k.sd!=null?k.m-3*k.sd:null,k.sd!=null?k.m+3*k.sd:null,t?t.h:null,gOut(s,k)])});
 all(l).forEach(s=>s.d.forEach(r=>r.c&&C.push([s.n,dtf(r.t),isV(s)?r.v:r.v,r.op,r.c.r.join(', '),r.c.a.join(', '),r.c.x])));
 sh('Relevés',['Lot','Produit','Recette','N° saisie','Heure prévue','Heure réelle','Valeur','Unité','Nominal','Mini','Maxi','Statut','Opérateur','Balance','Thermomètre'],R);
 sh('Corrections',['Recette','Heure','Valeur','Opérateur','Raisons','Actions','Précisions'],C);
 sh('Statistiques',['Recette','Unité','Nominal','Mini','Maxi','Attendus','Réalisés','Manquants','Moyenne','Écart-type','Médiane','Min','Max','Étendue','% hors tol.','Cp','Cpk','Moy − 3σ','Moy + 3σ','Tendance /h','HT estimé Gauss %'],ST).eachRow((r,n)=>n>1&&r.eachCell(c=>{if(typeof c.value==='number')c.numFmt='0.00'}));
 const g=wb.addWorksheet('Graphique');for(let i=0;i<ns;i++){if(!l.steps[i].d.length)continue;g.addRow([l.steps[i].n+' · courbe, moyenne, ±1 écart-type, tendance | courbe de Gauss']).font={bold:true};await imgs(wb,g,l.steps[i],i)}
 if(l.extra.length){const w=wb.addWorksheet('Enregistrement');w.columns=Array(8).fill({width:18});
  for(let j=0;j<l.extra.length;j++){const s=l.extra[j],i=ns+1+j,k=stats(s),t=trend(s);w.addRow([`${s.n} (${s.u})`]).font={bold:true,size:13};hdr(w.addRow(['Heure','Valeur','Opérateur','Balance','Thermomètre','Correction']));
   s.d.forEach(r=>w.addRow([dtf(r.t),r.v,r.op,r.bal,r.th,r.c?r.c.a.join(', ')+' '+r.c.x:'']));w.addRow([]);hdr(w.addRow(['Relevés','Moyenne','Écart-type','Min','Max','Tendance /h']));w.addRow(k?[k.n,k.m,k.sd,k.mn,k.mx,t?t.h:null]:['0']);w.addRow([]);await imgs(wb,w,s,i)}}
 const v=wb.addWorksheet('Visuel');hdr(v.addRow(['Heure','Résultat','Opérateur','Balance','Thermomètre','Correction','Photo']));v.columns.forEach((c,k)=>c.width=k===6?26:18);
 for(const r of l.vis.d){const row=v.addRow([dtf(r.t),r.v==='OK'?'OK':'Non conforme',r.op,r.bal,r.th,r.c?r.c.a.join(', ')+' '+r.c.x:'']);if(r.photo){row.height=95;const id=wb.addImage({base64:r.photo.split(',')[1],extension:'jpeg'});v.addImage(id,{tl:{col:6,row:row.number-1},ext:{width:160,height:120}})}}
 const d=new Date(end),p=n=>String(n).padStart(2,'0');dl(new Blob([await wb.xlsx.writeBuffer()]),`${l.code}_${l.pc}_${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}.xlsx`);render()}
