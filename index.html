const recKey=n=>{const k=nrm(String(n).replace(/\s*[:：]\s*$/,''));return k==='garniture'?'garniture 1':k};
const colL=i=>{let s='';i++;while(i){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s};
const TC={tarto:['#FFF3B0','#7a6400'],fillpack:['#FBD9E8','#8a2a5a'],pompe:['#FFE3C7','#8a4a10'],nappeuse:['#D6EEFB','#0e5a7a'],cuve:['#EADFCB','#5a4020']},tcs=l=>{const t=TC[nrm(l)]||['#E4E7EB','#444'];return `background:${t[0]};color:${t[1]};border-color:${t[1]}66`};
const EQ=()=>S.eqs.find(e=>e.v===S.eact),saveE=()=>put('eqs',{list:S.eqs,act:S.eact});
function parseEq(grids,cat){const sh=grids.find(s=>s.g.some(r=>r&&r.some(x=>x!=null)));if(!sh)throw new Error('fichier vide');
 const g=sh.g,hr=g.findIndex(r=>r&&r.some(x=>x!=null)),data={},warns=[],errs=[],names={};
 g[hr].forEach((raw,ci)=>{if(raw==null||String(raw).trim()==='')return;const name=String(raw).replace(/\s*[:：]\s*$/,'').trim(),key=recKey(name),series=[];let cur=null;
  for(let r=hr+1;r<g.length;r++){const cell=g[r]&&g[r][ci];if(cell==null||String(cell).trim()===''){cur=null;continue}
   let t=String(cell).trim(),plus=false;if(t[0]==='+'){plus=true;t=t.slice(1).trim()}
   const m=t.match(/^(.*?)\s*\(([^()]+)\)\s*$/);if(!m||!m[1].trim()){errs.push(`${colL(ci)}${r+1} : « ${t} » n’a pas de code entre parenthèses`);continue}
   if(!cur){cur={label:m[1].trim().split(/\s+/)[0],multi:false,items:[],plus:0};series.push(cur)}
   const code=m[2].trim(),nm=m[1].trim();if(plus){cur.multi=true;cur.plus++}
   if(cur.items.some(i=>i.code===code)){warns.push(`${colL(ci)}${r+1} : code ${code} en double dans la série`);continue}
   if(names[code]&&names[code]!==nm)warns.push(`${colL(ci)}${r+1} : le code ${code} désigne « ${nm} » ici et « ${names[code]} » ailleurs`);names[code]=nm;cur.items.push({code,name:nm})}
  series.forEach(s=>{if(s.plus&&s.plus<s.items.length)warns.push(`${name} : série ${s.label} avec « + » sur une partie seulement (traitée comme 1 ou 2)`);delete s.plus});
  if(series.length){if(data[key])warns.push(`Recette « ${name} » en double : la dernière colonne est conservée`);data[key]={name,series}}});
 if(errs.length)throw new Error('codes manquants :\n'+errs.slice(0,10).join('\n')+(errs.length>10?`\n… (${errs.length} au total)`:''));
 if(!Object.keys(data).length)throw new Error('aucune recette avec équipements trouvée');
 const known=new Set(cat.items.flatMap(p=>p.st.map(s=>recKey(s.n))));Object.keys(data).forEach(k=>{if(!known.has(k))warns.push(`Recette « ${data[k].name} » absente du catalogue actif (ignorée tant qu’elle n’y figure pas)`)});
 return{data,warns,sheet:sh.name}}
async function impE(file){if(!file)return;try{const buf=await file.arrayBuffer();let gr;try{gr=await zipGrids(buf)}catch(e1){if(!window.ExcelJS)throw e1;try{gr=await gridsEx(buf)}catch(e2){throw e1}}
 const r=parseEq(gr,S.cats.find(c=>c.v===S.act)),codes=new Set(Object.values(r.data).flatMap(d=>d.series.flatMap(s=>s.items.map(i=>i.code))));
 S.pendE={name:file.name,...r,note:`${Object.keys(r.data).length} recettes · ${codes.size} équipements`}}catch(e){S.pendE=null;alert('Import impossible : '+e.message)}render()}

${p?`<div style="margin-top:8px"><b>${esc(p.name)}</b><div class="muted">${esc(p.note)}${p.sheet?' · feuille « '+esc(p.sheet)+' »':''}</div>${p.warns.map(w=>`<div class="al">${esc(w)}</div>`).join('')}<button onclick="saveEq()">${ic('save')}Enregistrer comme v${(S.eqs.length?Math.max(...S.eqs.map(e=>e.v)):0)+1}</button></div>`:''}

 Object.entries(src).forEach(([k,e])=>e.series.forEach((se,si)=>{const nw=(S.sel[k]||{})[si]||[],old=l.eqOn?se.sel:[];

PG.rel=()=>{const l=L(),ro=l.closed;if(!S.rf||S.rf.lot!==l.code)S.rf=RF0(l.code);const F=S.rf,

const NOT=[['Démarrer un lot','Sur l’accueil : n° de lot (proposé : dernier chiffre de l’année + n° du jour + R, modifiable), produit, n° de balance, n° de thermomètre (facultatif), nom et prénom. Un seul lot peut être ouvert à la fois : il faut le clôturer avant d’en démarrer un autre. Si les équipements sont obligatoires, choisissez-les avant de démarrer.'],['Saisir une recette','Chaque recette (pâte, garniture, meringue…) a sa couleur et son rythme. Elle démarre à sa première saisie : bouton « Saisie poids » (« Saisie » pour un enregistrement) qui ouvre un pavé numérique. Par défaut la 1re saisie comporte 3 séries de 4 pesées, les suivantes 1 série de 4 pesées, avec 2 pesées au minimum par série ; les colonnes se nomment V1, V2, V3, V4 (les voies) et la voie est enregistrée avec chaque valeur. Ces quantités se règlent sur l’accueil (« Réglage des saisies ») et sont copiées dans chaque nouveau lot. Les dernières saisies s’affichent sous la carte, une ligne par série. Ensuite une saisie est attendue à chaque intervalle du catalogue (30 min par défaut). <b>Le compteur repart à zéro à chaque validation d’un relevé</b> et affiche « Dans X min » ou « Retard X min », mis à jour chaque minute. Le poids nominal est affiché en grand ; la zone de saisie est encadrée par le min et le max.'],['Hors tolérance','Une valeur hors min/max ouvre un cadre rouge ⚠️ bloquant : indiquez les actions menées (liste ou texte libre). La carte reste en rouge jusqu’au prochain relevé conforme.'],['Visuel','Recette ajoutée automatiquement à chaque lot, toutes les 30 min : choisir Conforme ou Non conforme et prendre une photo (caméra de la tablette). Si la photo n’est pas obligatoire pour ce lot, elle est facultative. Non conforme déclenche une correction. Le compteur repart à zéro à chaque enregistrement.'],['Enregistrement','Bouton « Ajouter un enregistrement » : saisie exceptionnelle (température, poids…) sans nominal ni tolérance, avec son propre graphique. Non repris dans le catalogue Excel.'],['Changer d’opérateur','Bouton « Changer d’opérateur » : le nouvel opérateur retrouve les saisies précédentes du lot. Chaque valeur garde le nom de celui qui l’a saisie. À 5 h, 13 h et 21 h, le bouton clignote avec un bandeau « Relève » tant que l’opérateur n’a pas été changé (si le lot a démarré avant l’heure de relève) ; si le même opérateur continue, il valide quand même « Changer d’opérateur » avec son nom.'],['Balance et thermomètre','Le n° de balance est obligatoire au démarrage, le n° de thermomètre est facultatif. Bouton « Remplacer balance / thermo » : saisir le nouveau numéro et le motif (obligatoire) ; il permet aussi d’ajouter un thermomètre en cours de lot. Chaque relevé garde le numéro utilisé ; l’historique figure dans l’onglet Lot de l’export.'],['Équipements','Importer le fichier sur l’accueil (carte « Équipements ») : il est mémorisé par version, comme le catalogue. Format : une colonne par recette (nom en 1re ligne, mêmes noms que le catalogue : Pâte, Garniture 1, Garniture 2, Nappage, Micro doseuse, Meringue), puis les équipements ; une ligne vide sépare les séries. Chaque équipement doit avoir un code entre parenthèses, par exemple Pompe 1 (P1), sinon l’import est refusé. Un signe + devant les équipements d’une série autorise d’en choisir 1 ou 2 (Tarto) ; sinon un seul est obligatoire par série. Avant le lot, rien n’est présélectionné : choisissez un équipement par série ; un équipement pris par une recette est grisé pour les autres. Les codes s’affichent en badges ronds sous le nom de la recette (une couleur par type d’équipement).'],['Équipements : option, activation, remplacement','La case « Équipements obligatoires » (cochée par défaut) peut être décochée à l’accueil : dans le lot, le bouton devient « Activer les équipements » ; l’activation est définitive et les relevés déjà saisis restent sans équipement. Bouton « Remplacer un équipement » : une page présente toutes les recettes du lot avec des boutons à toucher ; seuls les équipements libres sont proposés ; un seul motif obligatoire pour la validation ; l’ancien redevient disponible ; pour Tarto on peut ajouter ou retirer un Tarto (1 minimum). Chaque relevé garde les équipements en cours ; chaque changement est daté dans la page Historique et dans l’onglet Équipements de l’export.'],['Remarques','Bouton « 📝 Remarque » dans le cadre du lot : une page permet d’ajouter une remarque libre, horodatée avec l’opérateur ; elle n’est pas rattachée à une recette et n’est ni modifiable ni supprimable. Les remarques apparaissent dans la page Historique (ligne 📝) et dans l’export (onglet Remarques et lignes « Remarque » de l’onglet Relevés). Consultables sur un lot clôturé.'],['Page Historique : tris et filtres','Par défaut du plus récent au plus ancien, avec un séparateur par jour (deux journées ne sont jamais mélangées). Touchez un titre de colonne pour trier (Heure, Recette, Voie, Valeur, Opérateur, Statut) ; le bouton « Filtrer » ouvre les filtres par recette, voie, type, statut, opérateur, jour et une recherche dans les motifs et remarques. Les lignes « Non réalisé » y figurent. Les filtres ne modifient pas l’export, qui reste complet.'],['Annuler un relevé','Page Historique : bouton « Annuler » à côté d’une valeur, avec motif obligatoire. La ligne reste visible, barrée et marquée « Annulé » (avec l’heure, l’opérateur et le motif) ; elle n’est plus comptée dans les statistiques, les courbes ni le compteur, qui revient à la dernière valeur valide. Elle figure dans l’export. Impossible sur un lot clôturé.'],['Graphiques','Boutons « Graphique / Valeurs » pour basculer entre la courbe et le tableau. Le graphique commun est en bas de la page Saisie. La page Statistiques ajoute la tendance et la courbe de Gauss.'],['Écart-type (σ)','Mesure la dispersion des poids autour de la moyenne : plus σ est petit, plus les poids sont réguliers. Calcul : σ = racine de [somme des (valeur − moyenne)² ÷ (n − 1)]. Si les poids suivent une loi normale, environ 68 % des valeurs sont à moins de 1σ de la moyenne, 95 % à moins de 2σ et 99,7 % à moins de 3σ.'],['Cp (capabilité potentielle)','Cp = (tolérance maxi − tolérance mini) ÷ 6σ. Compare la largeur de la tolérance à la dispersion réelle, sans tenir compte du centrage. Cp ≥ 1,33 : procédé capable ; entre 1 et 1,33 : limite ; inférieur à 1 : dispersion trop grande pour la tolérance.'],['Cpk (capabilité réelle)','Cpk = plus petite valeur entre (maxi − moyenne) ÷ 3σ et (moyenne − mini) ÷ 3σ. Tient compte du centrage de la moyenne dans la tolérance. Le Cpk est toujours inférieur ou égal au Cp : un Cp élevé avec un Cpk bas signale un procédé régulier mais décentré (poids trop proches d’une limite). Seuil usuel : 1,33. Avec peu de relevés, ces valeurs sont indicatives.'],['Courbe de Gauss','Courbe en cloche (loi normale) construite avec la moyenne et l’écart-type de vos relevés. Le sommet correspond à la moyenne ; plus la cloche est étroite, plus la production est régulière. Les traits rouges sont le min et le max, le trait vert est le nominal, les points sont les relevés. Les zones rouges sous la courbe estiment la part de produits hors tolérance (« HT estimé »). Cette estimation suppose une distribution normale.'],['Tendance','Droite qui résume l’évolution des poids dans le temps, en unité par heure. Positive : le poids augmente ; négative : il diminue ; proche de zéro : stable.'],['Clôture et export','Page Clôture : les relevés manquants sont signalés sans bloquer. « Clôturer et exporter » génère le fichier Excel lot_produit_aammjj, le relit pour le contrôler (onglets, nombre de lignes, valeurs invalides, images), puis seulement ensuite le télécharge, génère le PDF, verrouille le lot en lecture seule et télécharge une sauvegarde JSON (3 téléchargements). Si le contrôle de l’Excel échoue, le lot reste ouvert. Si le PDF échoue, le lot est clôturé quand même avec un avertissement et le bouton « Exporter le PDF » permet de le refaire, aussi sur un lot clôturé. Le PDF (A4 paysage) reprend les mêmes données que l’Excel, avec une page de départ par onglet, un en-tête « Lot » en grand titre et un pied de page avec la date d’édition et « Page X sur N » ; les symboles non pris en charge par les polices standard sont remplacés par du texte. Onglets : Lot (recettes, contrôles, empreinte), Relevés (liste chronologique complète avec écart de temps et motifs), Corrections et Statistiques (recettes en colonnes), Graphique, Enregistrement, Équipements (noms), Remarques, Visuel. Ré-export possible.'],['Lots clôturés','Sur l’accueil, les lots clôturés sont groupés par semaine (du lundi au dimanche, selon la date de démarrage du lot) dans des listes dépliables ; la plus récente est ouverte. Chaque lot indique sa taille estimée sur l’appareil, et le stockage utilisé et restant est affiché au-dessus de la liste. Les boutons Excel et PDF refont les mêmes fichiers qu’à la clôture.'],['Paramètres : saisies ajoutées','Le bouton Paramètres (à gauche de Accueil) liste les séries du catalogue équipements actif (Pâte, Garniture 1…). « Ajouter saisie » crée une saisie supplémentaire pour une série : nom, unité, nombre de saisies (1ère fois et suivantes), min et max. Elle s’affiche dans la carte de la série et se saisit dans la même fenêtre que la pesée (bouton Saisie poids), sans bouton d’activation : elle se règle uniquement dans Paramètres. Dans le lot, un interrupteur l’active ou la désactive à tout moment (les valeurs déjà saisies sont conservées). Dans Paramètres, l’interrupteur d’une saisie l’active ou la désactive aussitôt dans les lots en cours (carte de la série et fenêtre Saisie poids) ; les modifications (nom, unité, min, max, nombre de saisies) s’appliquent aussi aux lots en cours, sans changer les lots clôturés ; chaque valeur déjà saisie garde la tolérance en vigueur à sa saisie. Une saisie supprimée est retirée d’un lot en cours si elle n’a aucune valeur, sinon désactivée (valeurs conservées). Les valeurs figurent dans l’Historique, l’onglet Enregistrement de l’Excel et du PDF, et la sauvegarde JSON.'],['Catalogue et versions','Accueil > Catalogue : importer un fichier Excel crée une nouvelle version avec le résumé des changements. Colonnes par recette : Nominal X, Tolérance mini X, Tolérance maxi X, Temps X (intervalle en minutes). Une recette sans nominal est ignorée ; sans tolérance, elle n’est pas contrôlée. Le fichier peut être modifié avec Excel, Google Sheets ou LibreOffice puis enregistré en .xlsx : l’application cherche elle-même la feuille et la ligne d’en-têtes (accents et majuscules sans importance) et signale les anomalies avant l’enregistrement. « Garniture » sans numéro est lue comme Garniture 1. Chaque lot garde sa version.'],['Données et sauvegarde','Tout est enregistré sur l’appareil à chaque saisie, même sans réseau. Les données restent propres à chaque poste. Utilisez « Sauvegarde JSON » en cas de changement d’appareil.'],['Installation et mises à jour','Première ouverture avec Internet, puis « Installer » depuis le navigateur (Edge ou Chrome). Quand une nouvelle version est disponible, un bandeau propose la mise à jour.']];
